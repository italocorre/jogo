name: Gerar .exe (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Verificar segredos da Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltam segredos no repositório:$missing. Veja o README (seção 'Configurar o build')."
            exit 1
          fi

      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Cache da pasta Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-

      - name: Compilar com a Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: MarAberto
          buildMethod: MarAberto.EditorTools.BuildScript.BuildWindows
          versioning: None
          allowDirtyBuild: true

      - name: Compactar
        run: |
          cd build/StandaloneWindows64
          sudo rm -rf *_BurstDebugInformation_DoNotShip || true
          zip -qr "$GITHUB_WORKSPACE/MarAberto-Windows.zip" .
          ls -lh "$GITHUB_WORKSPACE/MarAberto-Windows.zip"

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: MarAberto-Windows
          path: MarAberto-Windows.zip
          retention-days: 14

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mar Aberto — build ${{ github.run_number }}
          body: |
            Build automático do commit ${{ github.sha }}.
            Baixe **MarAberto-Windows.zip**, extraia e abra **MarAberto.exe**.
          files: MarAberto-Windows.zip
          make_latest: true
