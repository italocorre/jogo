name: Gerar .exe (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Preparar credenciais da Unity
        env:
          RAW_LICENSE: ${{ secrets.UNITY_LICENSE }}
          RAW_EMAIL: ${{ secrets.UNITY_EMAIL }}
          RAW_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # Remove espaços e quebras de linha coladas sem querer (causa comum de falha no login).
          email="$(printf '%s' "$RAW_EMAIL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          password="$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')"
          missing=""
          [ -z "$RAW_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$email" ] && missing="$missing UNITY_EMAIL"
          [ -z "$password" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltam segredos no repositório:$missing. Veja o README (seção 'Configurar o build')."
            exit 1
          fi
          if ! printf '%s' "$RAW_LICENSE" | grep -q "<License"; then
            echo "::error::UNITY_LICENSE não parece ser o conteúdo do arquivo Unity_lic.ulf (deve começar com <?xml e conter <License>)."
            exit 1
          fi
          echo "::add-mask::$password"
          echo "UNITY_EMAIL=$email" >> "$GITHUB_ENV"
          echo "UNITY_PASSWORD=$password" >> "$GITHUB_ENV"
          {
            echo "UNITY_LICENSE<<ULF_EOF_7f3a"
            printf '%s\n' "$RAW_LICENSE" | tr -d '\r'
            echo "ULF_EOF_7f3a"
          } >> "$GITHUB_ENV"

      - name: Testar login na conta Unity
        run: |
          body=$(jq -n --arg u "$UNITY_EMAIL" --arg p "$UNITY_PASSWORD" '{grant_type:"password",username:$u,password:$p}')
          resp=$(curl -s -w '\n%{http_code}' -H 'Content-Type: application/json' -d "$body" https://core.cloud.unity3d.com/api/login || true)
          code=$(printf '%s' "$resp" | tail -n1)
          msg=$(printf '%s' "$resp" | sed '$d' | jq -r '.message // .error_description // .error // empty' 2>/dev/null || true)
          if [ "$code" = "200" ]; then
            echo "Login na Unity OK."
          else
            echo "::warning::A Unity recusou o login (HTTP $code) ${msg}. Confira UNITY_EMAIL/UNITY_PASSWORD. Conta criada com Google/Apple precisa ter uma senha definida em id.unity.com, e a verificação em duas etapas (2FA) precisa estar desligada."
          fi

      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Cache da pasta Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-

      - name: Compilar com a Unity
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          buildName: MarAberto
          buildMethod: MarAberto.EditorTools.BuildScript.BuildWindows
          versioning: None
          allowDirtyBuild: true

      - name: Publicar prints do jogo
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prints
          name: Prints automáticos (último build)
          body: |
            Prints tirados automaticamente durante o build ${{ github.run_number }} (commit ${{ github.sha }}).
          prerelease: true
          make_latest: false
          files: screens/*
          fail_on_unmatched_files: false

      - name: Compactar
        run: |
          cd build/StandaloneWindows64
          sudo rm -rf *_BurstDebugInformation_DoNotShip || true
          zip -qr "$GITHUB_WORKSPACE/MarAberto-Windows.zip" .
          ls -lh "$GITHUB_WORKSPACE/MarAberto-Windows.zip"

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: MarAberto-Windows
          path: MarAberto-Windows.zip
          retention-days: 14

      - name: Publicar versão para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mar Aberto — build ${{ github.run_number }}
          body: |
            Build automático do commit ${{ github.sha }}.
            Baixe **MarAberto-Windows.zip**, extraia e abra **MarAberto.exe**.
          files: MarAberto-Windows.zip
          make_latest: true
